<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee API test page</title>
  <style>
    :root {
      --ink: #1c2530;
      --muted: #5f6b7a;
      --line: #d9dee5;
      --surface: #ffffff;
      --page: #f3f5f8;
      --accent: #1f5fbf;
      --ok-bg: #e6f4ea;
      --ok-ink: #17602e;
      --error-bg: #fdeaea;
      --error-ink: #9b1c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    main { max-width: 1040px; margin: 0 auto; }

    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    header a { color: var(--accent); }
    .muted { color: var(--muted); }

    section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); }
    input {
      display: block; width: 100%; margin-top: 4px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--ink);
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    button {
      padding: 8px 14px; border: 1px solid var(--accent); border-radius: 6px;
      background: var(--accent); color: #fff; font: inherit; cursor: pointer;
    }
    button.secondary { background: var(--surface); color: var(--accent); }
    button.danger { background: var(--surface); color: var(--error-ink); border-color: var(--error-ink); padding: 4px 10px; }

    .lookup { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
    .lookup label { width: 140px; }

    .banner { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-weight: 600; }
    .banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .banner.error { background: var(--error-bg); color: var(--error-ink); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }

    .log-entry { border-left: 4px solid var(--ok-ink); padding: 6px 10px; margin-bottom: 10px; background: var(--page); border-radius: 0 6px 6px 0; }
    .log-entry.error { border-left-color: var(--error-ink); }
    .log-heading { font: 13px Consolas, monospace; font-weight: 600; }
    pre { margin: 6px 0 0; font: 13px Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Employee API test page</h1>
        <div class="muted">Calls <code>/api/employees</code> on this server and shows what it answers.</div>
      </div>
      <a href="/swagger">Open Swagger</a>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <section>
      <h2>Add employee (POST)</h2>
      <!-- novalidate: let the API do the validating so its 400 responses can be seen. -->
      <form id="employee-form" novalidate>
        <div class="grid">
          <label>First name <input name="firstName" autocomplete="off"></label>
          <label>Last name <input name="lastName" autocomplete="off"></label>
          <label>Email <input name="email" autocomplete="off"></label>
          <label>Department <input name="department" autocomplete="off"></label>
        </div>
        <div class="buttons" style="margin-top: 12px">
          <button type="submit">Add employee</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Find or delete by id (GET / DELETE)</h2>
      <form id="lookup-form" class="lookup" novalidate>
        <label>Id <input id="lookup-id" inputmode="numeric" autocomplete="off"></label>
        <button type="submit" value="get">Get</button>
        <button type="submit" value="delete" class="secondary">Delete</button>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2>Employees (<span id="employee-count">0</span>)</h2>
        <div class="buttons">
          <button type="button" id="load-sample" class="secondary">Load sample data</button>
          <button type="button" id="refresh" class="secondary">Refresh</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Id</th><th>Name</th><th>Email</th><th>Department</th><th>Created</th><th></th></tr>
          </thead>
          <tbody id="employee-rows"></tbody>
        </table>
      </div>
      <div id="empty-state" class="muted" style="padding: 12px 10px">No employees yet. Add one above or load the sample data.</div>
    </section>

    <section>
      <div class="section-head">
        <h2>API responses (newest first)</h2>
        <button type="button" id="clear-log" class="secondary">Clear</button>
      </div>
      <div id="log"></div>
    </section>
  </main>

  <script src="load-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
